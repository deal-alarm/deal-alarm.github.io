name: Hot Deals stündlich aktualisieren

on:
  # Stündlicher Lauf pausiert (21.10.2026, Amazon-Anmeldung klappt noch nicht).
  # Zum Wieder-Einschalten die beiden Zeilen darunter wieder aktivieren.
  # schedule:
  #   - cron: "7 * * * *"  # jede Stunde zur Minute 7
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hot-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deals holen und Seite bauen
        env:
          CREATORS_API_CLIENT_ID: ${{ secrets.CREATORS_API_CLIENT_ID }}
          CREATORS_API_CLIENT_SECRET: ${{ secrets.CREATORS_API_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python3 deals.py
      - name: Storefront-Auswahl im Repo speichern
        run: |
          git config user.name "hot-deals-bot"
          git config user.email "hot-deals-bot@users.noreply.github.com"
          git add storefront-auswahl.md
          git diff --cached --quiet || git commit -m "Storefront-Auswahl aktualisiert"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
